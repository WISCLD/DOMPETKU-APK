name: Build DOMPETKU APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          LATEST_DIR=$(find "$SDK_ROOT/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
          if [ -z "$LATEST_DIR" ]; then
            curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-extracted
            mv /tmp/cmdtools-extracted/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdtools.zip /tmp/cmdtools-extracted
          elif [ "$(basename "$LATEST_DIR")" != "latest" ]; then
            mv "$LATEST_DIR" "$SDK_ROOT/cmdline-tools/latest"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_PATH"

          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          yes | sdkmanager --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Initialize and sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dompetku-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
